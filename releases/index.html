<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الإصدارات المنشورة - Portable">
    <title>الإصدارات - Portable</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">Portable</a>
            <ul class="navbar-menu">
                <li><a href="../index.html">الرئيسية</a></li>
                <li><a href="../projects/index.html">المشاريع</a></li>
                <li><a href="index.html">الإصدارات</a></li>
            </ul>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <h1 class="section-title">الإصدارات المنشورة</h1>
        <p style="margin-bottom: 2rem; color: var(--text-secondary);">
            قائمة بجميع الإصدارات المنشورة من البرامج المحمولة
        </p>

        <!-- جدول الإصدارات -->
        <div class="card" style="padding: 1.5rem;">
            <div id="releasesList">
                <!-- سيتم تحميل الإصدارات من projects.json -->
            </div>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="footer">
        <div class="main-content">
            <p>&copy; 2026 Portable - مكتبة البرامج المحمولة</p>
            <p>جميع البرامج مجانية ومفتوحة المصدر</p>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script>
        // تحميل الإصدارات المنشورة
        async function loadReleases() {
            try {
                const response = await fetch('../assets/js/projects.json');
                const data = await response.json();
                
                // تصفية المشاريع المنشورة فقط
                const releasedProjects = data.projects.filter(p => 
                    p.released === true && 
                    p.downloadUrl && 
                    p.version
                );
                
                const container = document.getElementById('releasesList');
                
                if (releasedProjects.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">لا توجد إصدارات منشورة حاليًا</p>';
                    return;
                }
                
                container.innerHTML = `
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color);">
                                <th style="padding: 1rem; text-align: right;">المشروع</th>
                                <th style="padding: 1rem; text-align: right;">الإصدار</th>
                                <th style="padding: 1rem; text-align: right;">تاريخ الإصدار</th>
                                <th style="padding: 1rem; text-align: right;">المنصة</th>
                                <th style="padding: 1rem; text-align: center;">التحميل</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${releasedProjects.map(project => `
                                <tr style="border-bottom: 1px solid var(--border-color);">
                                    <td style="padding: 1rem;">
                                        <a href="../projects/${project.slug}/index.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">
                                            ${project.name}
                                        </a>
                                    </td>
                                    <td style="padding: 1rem;">
                                        <span style="background: var(--primary-color); color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem;">
                                            ${project.version}
                                        </span>
                                    </td>
                                    <td style="padding: 1rem; color: var(--text-secondary);">
                                        ${project.releaseDate || '-'}
                                    </td>
                                    <td style="padding: 1rem; color: var(--text-secondary);">
                                        ${project.platforms ? project.platforms.map(p => p === 'windows' ? 'Windows' : p).join(', ') : '-'}
                                    </td>
                                    <td style="padding: 1rem; text-align: center;">
                                        <a href="${project.downloadUrl}" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">
                                            تحميل
                                        </a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('خطأ في تحميل الإصدارات:', error);
                document.getElementById('releasesList').innerHTML = '<p style="text-align: center; color: #ef4444; padding: 2rem;">حدث خطأ في تحميل الإصدارات</p>';
            }
        }
        
        loadReleases();
    </script>
</body>
</html>
